<!DOCTYPE html>

<title>Ujian Akhir Semester Ganjil – Sejarah Tingkat Lanjut XI</title>
<style>
:root{--card:#fffdfb;--tx:#3b3358;--mut:#7a7396;--bd:#e6e0f5;--pri:#a99cff;--pt:#6a58d6;--ok:#8fe3b8;--okt:#1f8f5f;--rg:#ffd98a;--no:#f1eefb;--bad:#e0555f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2a2748;--tx:#f1eeff;--mut:#b9b4d9;--bd:#47436f;--no:#38355e;--pt:#cfc6ff;--okt:#7fe3b2}}
:root[data-theme="dark"]{--card:#2a2748;--tx:#f1eeff;--mut:#b9b4d9;--bd:#47436f;--no:#38355e;--pt:#cfc6ff;--okt:#7fe3b2}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,#ffd9ea,#d9e4ff 40%,#d3f6e6 72%,#fff1c9) fixed;-webkit-user-select:none;user-select:none}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(20,10,80,.25);margin-bottom:14px}
h1{margin:0 0 4px;font-size:1.35rem}.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx);-webkit-user-select:text;user-select:text}
input:focus{outline:2px solid var(--pri);border-color:transparent}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#2b2350}
.btn.sec{background:var(--no);color:var(--tx)}.btn.rg{background:var(--rg);color:#1b1300}.btn.ok{background:var(--ok)}.btn.on{outline:3px solid var(--rg)}
.btn.w{width:100%;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{flex:1;min-width:56px;padding:11px 0;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.chip.on{background:var(--pri);border-color:var(--pt);color:#2b2350}
.err{color:var(--bad);font-size:.88rem;margin-top:8px;min-height:1.2em}
.rules{background:var(--no);border-radius:12px;padding:10px 14px;font-size:.86rem;margin-top:14px;color:var(--mut)}
.rules li{margin:3px 0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);padding:10px 16px;border-radius:14px;box-shadow:0 6px 18px rgba(20,10,80,.25);margin-bottom:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:4;background:#ffd9ea}
.tm{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--pt)}.tm.low{color:var(--bad)}
.nm{font-size:.82rem;color:var(--mut);line-height:1.3}
.qn{font-size:.85rem;color:var(--pt);font-weight:700;margin-bottom:6px}
.qt{font-size:1.02rem;margin-bottom:14px}
.op{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:9px;cursor:pointer}
.op.sel{border-color:var(--pri);background:rgba(169,156,255,.22)}
.op b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--no);display:grid;place-items:center;font-size:.8rem}
.op.sel b{background:var(--pri);color:#2b2350}
.bar{display:flex;gap:8px;margin-top:14px}.bar .btn{flex:1;padding:12px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.g{padding:9px 0;border-radius:10px;border:2px solid transparent;background:var(--no);color:var(--tx);font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.g.a{background:var(--ok);color:#0f3d2a}.g.r{background:var(--rg);color:#1b1300}.g.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--mut);margin-top:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.ov{position:fixed;inset:0;background:rgba(10,5,40,.75);display:grid;place-items:center;padding:20px;z-index:20}
.ov .card{max-width:420px;margin:0}
.score{font-size:3.4rem;font-weight:800;color:var(--pt);line-height:1}
.rv{border-left:5px solid var(--bd)}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}
.tag{font-size:.8rem;font-weight:700}.pb{background:var(--no);border-radius:10px;padding:10px 12px;font-size:.92rem;margin-top:8px}
.info td{padding:2px 12px 2px 0}.hide{display:none}
</style></head><body><div class="wrap" id="app"></div>
<script>
var DATA=[{"q": "Peradaban Mesopotamia lahir di lembah Sungai Tigris dan Eufrat yang subur, namun rentan terhadap luapan banjir bandang yang tidak terprediksi serta ancaman musim kemarau yang ekstrem. Untuk mengatasi tantangan bentang alam tersebut, bangsa Sumeria membangun sistem kanal dan waduk kuno yang terstruktur secara masif. Berdasarkan narasi geografi tersebut, korelasi logis antara tantangan alam dengan perkembangan peradaban Mesopotamia awal adalah...", "o": ["Banjir tahunan memusnahkan seluruh kebudayaan tulis-menulis setiap pergantian musim tanam baru", "Kemarau ekstrem memaksa penduduk beralih profesi menjadi pedagang laut dan meninggalkan pertanian", "Ketidakteraturan siklus alam mendorong terciptanya inovasi teknologi irigasi dan organisasi sosial pemerintahan", "Letak diapit dua sungai membuat wilayah ini aman secara mutlak dari invasi militer bangsa pegunungan", "Sungai Tigris dan Eufrat menyediakan cadangan ikan berlimpah sehingga masyarakat tidak perlu bertani"], "a": 2, "p": "Sungai yang banjirnya tak menentu memaksa orang Sumeria membuat kanal, waduk, dan lembaga pengatur air. Dari situlah lahir irigasi dan organisasi pemerintahan."}, {"q": "Bangsa Sumeria di Mesopotamia mengembangkan sistem matematika seksagesimal atau basis bilangan 60. Sistem perhitungan ini digunakan untuk membagi satu jam menjadi 60 menit, satu menit menjadi 60 detik, serta satu lingkaran penuh menjadi 360 derajat. Jika sistem bilangan basis 60 tersebut tidak pernah ditemukan atau tidak diadaptasi oleh peradaban modern, dampak logis yang paling signifikan terhadap ilmu pengetahuan masa kini adalah...", "o": ["Astronomi modern tidak akan mampu menghitung pergerakan rotasi benda langit secara sistematis dan presisi", "Ilmu navigasi maritim mutlak tidak bisa diterapkan karena ketiadaan konsep dasar mengenai koordinat lintang", "Teknologi perangkat digital tidak dapat berkembang karena komputer akan kehilangan bahasa pemrograman dasar", "Sistem penanggalan masehi akan kehilangan fungsi utamanya dalam menentukan pergantian periode musim tahunan", "Perhitungan sudut dalam ilmu geometri harus diformulasikan ulang secara total menggunakan sistem basis desimal"], "a": 0, "p": "Basis 60 adalah dasar pembagian waktu (jam, menit, detik) dan sudut (360°). Tanpanya, perhitungan benda langit dan rotasi bumi tidak akan tersusun sistematis dan presisi."}, {"q": "Codex Hammurabi merupakan salah satu undang-undang tertulis tertua peninggalan peradaban Babilonia. Hukum ini terkenal dengan prinsip \"mata ganti mata\" (Lex Talionis). Namun pada praktiknya, denda yang dijatuhkan bergantung pada status kelas sosial. Jika seorang bangsawan melukai rakyat biasa, ia hanya diwajibkan membayar denda perak. Sebaliknya, jika rakyat biasa melukai bangsawan, ia akan dijatuhi hukuman fisik amputasi. Evaluasi kritis yang menggambarkan corak sistem keadilan di Mesopotamia pada masa itu adalah...", "o": ["Hukum diciptakan semata-mata untuk memberikan perlindungan mutlak bagi kaum budak dan rakyat jelata", "Penegakan hukum memberlakukan kesetaraan di pengadilan tanpa memandang perbedaan kelas dan jabatan", "Keadilan ditegakkan berdasarkan asas kebebasan individu yang sejalan dengan nilai universal hak asasi manusia", "Hukum merupakan instrumen penjaga hierarki kekuasaan yang secara resmi melegitimasi ketidaksetaraan sosial", "Tatanan masyarakat berlandaskan nilai kasih sayang tanpa memuat unsur pembalasan penderitaan fisik sedikit pun"], "a": 3, "p": "Hukum Hammurabi memberi hukuman berbeda menurut kelas sosial, jadi hukum menjaga hierarki dan melegitimasi ketidaksetaraan, bukan persamaan di depan hukum."}, {"q": "Ziggurat adalah kuil raksasa berbentuk piramida berundak yang menjadi pusat spiritual sekaligus ekonomi masyarakat Mesopotamia. Pembangunan Ziggurat agung di kota Ur (sekitar abad ke-21 SM) menelan jutaan batu bata lumpur kering. Bangunan utama memiliki ukuran panjang dasar 64 meter, lebar dasar 46 meter, dan tinggi puncak menara diperkirakan mencapai 30 meter. Berdasarkan data dimensi geometris tersebut, simpulan logis mengenai peradaban perancang bangunannya adalah...", "o": ["Bangunan disusun secara acak tanpa adanya pertimbangan beban penopang pada bagian struktur fondasi", "Pembangun mampu menerapkan kalkulasi distribusi massa untuk menjamin kelayakan struktur bangunan tinggi", "Penggunaan batu bata lumpur menjamin seluruh bangunan bertahan utuh secara abadi dari bencana kebanjiran", "Ziggurat difungsikan sebagai makam bawah tanah para penguasa karena menyerupai arsitektur lembah raja Mesir", "Keseluruhan konstruksi monumen dikerjakan dengan teknologi asing karena peradaban lokal tidak mengenal matematika"], "a": 1, "p": "Dimensi Ziggurat yang terukur dan menjulang sampai 30 m hanya mungkin dibangun dengan hitungan distribusi beban yang matang, sehingga pembangunnya menguasai matematika dan rekayasa."}, {"q": "Bangsa Sumeria menciptakan huruf paku (cuneiform) yang ditulis di atas lempengan tanah liat basah lalu dikeringkan. Pada masa awalnya, tulisan purba ini tidak ditujukan untuk menyusun karya sastra maupun puisi spiritual, melainkan murni untuk mencatat administrasi penerimaan pajak, pembukuan hewan ternak, dan distribusi panen gandum balai kota. Mengacu pada fakta sejarah pencatatan administrasi ini, gagasan aplikatif yang sejalan untuk memperkuat transparansi tata kelola ekonomi di masa kini adalah...", "o": ["Mengganti seluruh pencatatan komputer perbankan modern dengan media pembukuan berbasis bahan organik bumi", "Memusnahkan setiap bentuk laporan keuangan fisik karena rentan mengalami kerusakan yang dimakan oleh cuaca", "Membangun sistem basis data digital terpusat yang mencatat rekaman riwayat transaksi secara terbuka dan permanen", "Menghapuskan segala bentuk pemungutan pajak pertanian agar kegiatan ekonomi daerah dapat berjalan lebih lancar", "Mewajibkan seluruh pegawai sektor perbankan untuk fasih mengartikan bahasa kuno dalam melayani pembukuan"], "a": 2, "p": "Tablet cuneiform mencatat pajak, ternak, dan panen sebagai bukti transaksi. Padanan modernnya adalah basis data digital terpusat yang mencatat transaksi terbuka dan permanen."}, {"q": "Sejarawan Yunani Kuno, Herodotus, menyebutkan bahwa \"Mesir adalah hadiah dari Sungai Nil\" (Egypt is the gift of the Nile). Setiap tahun, Sungai Nil mengalami siklus banjir yang meninggalkan endapan lumpur hitam (Kemet) yang sangat subur di tengah kepungan gurun pasir yang tandus (Deshret). Kondisi geografis inilah yang menjadi fondasi utama lahirnya peradaban agraris Mesir Kuno. Berdasarkan narasi geografi tersebut, korelasi logis antara siklus alam Sungai Nil dan perkembangan sistem pemerintahan Mesir Kuno adalah...", "o": ["Memaksa masyarakat membangun armada laut militer yang besar untuk menaklukkan wilayah hulu sungai", "Mendorong terbentuknya birokrasi negara yang terpusat untuk mengelola irigasi dan lumbung pangan", "Menghancurkan seluruh catatan sejarah tertulis setiap kali musim hujan tiba secara ekstrem dan tiba-tiba", "Membatasi interaksi perdagangan masyarakat hanya dengan bangsa-bangsa di kawasan pesisir Laut Merah", "Menjadikan firaun kehilangan legitimasi politiknya akibat kegagalan mengendalikan curah hujan tahunan"], "a": 1, "p": "Banjir Nil yang teratur menuntut pengelolaan irigasi dan lumbung pangan bersama, yang mendorong terbentuknya birokrasi negara terpusat di bawah Firaun."}, {"q": "Piramida Agung Giza yang dibangun pada masa pemerintahan Firaun Khufu (sekitar tahun 2560 SM) merupakan pencapaian arsitektur yang luar biasa. Bangunan ini memiliki tinggi asli sekitar 146,5 m dengan panjang sisi dasar mencapai 230,4 m. Struktur raksasa ini tersusun dari sekitar 2,3 juta blok batu, di mana setiap blok batunya memiliki berat rata-rata 2,5 ton. Berdasarkan besaran data numerik dari konstruksi Piramida Agung tersebut, evaluasi yang paling tepat mengenai kapasitas peradaban masyarakat Mesir Kuno saat itu adalah...", "o": ["Peradaban tersebut telah menguasai tata kelola manajemen logistik, matematika geometri, dan fisika mekanik", "Pembangunan dilakukan secara spontan tanpa adanya perencanaan arsitektur dan kepemimpinan jangka panjang", "Masyarakat mengandalkan praktik sihir dan campur tangan dewa secara langsung dalam memindahkan batuan raksasa", "Proyek pembangunan dikerjakan murni oleh mesin-mesin purba hasil pengaruh dari kebudayaan bangsa asing", "Sumber daya manusia yang digunakan seluruhnya berasal dari tawanan perang yang tidak membutuhkan makanan"], "a": 0, "p": "Angka tinggi, sisi dasar, jumlah dan bobot blok menunjukkan penguasaan logistik, geometri, dan mekanika. Piramida butuh perencanaan, bukan sihir atau mesin asing."}, {"q": "Masyarakat Mesir Kuno memiliki sistem kepercayaan yang sangat kompleks mengenai alam baka. Mereka meyakini bahwa jiwa manusia (Ka dan Ba) membutuhkan wadah fisik yang utuh agar dapat terus hidup di akhirat (Field of Reeds). Oleh karena itu, mereka mengembangkan teknik mumifikasi yang rumit. Bersama dengan mumi, disertakan pula Kitab Kematian (Book of the Dead) serta berbagai harta benda berharga di dalam makam. Bagaimana praktik pemakaman yang kompleks tersebut merefleksikan pandangan hidup peradaban Mesir Kuno?", "o": ["Menegaskan bahwa kekayaan material di dunia merupakan satu-satunya penentu keselamatan jiwa seseorang", "Memperlihatkan bahwa ilmu anatomi kedokteran dikembangkan semata-mata untuk mengobati penyakit menular", "Membuktikan bahwa seluruh lapisan masyarakat selalu mendapatkan perlakuan pemakaman yang setara secara ekonomi", "Mengindikasikan bahwa para pendeta memiliki kedudukan yang lebih rendah dibandingkan para ahli pembuat balsam", "Menunjukkan bahwa kehidupan abadi setelah kematian dipandang jauh lebih penting daripada kehidupan duniawi"], "a": 4, "p": "Mumifikasi, Kitab Kematian, dan bekal kubur menunjukkan keyakinan bahwa kehidupan abadi di akhirat lebih penting daripada kehidupan dunia."}, {"q": "Penemuan Batu Rosetta (Rosetta Stone) pada tahun 1799 menjadi kunci utama bagi para ahli bahasa untuk memecahkan misteri tulisan Hieroglif Mesir. Batu tersebut memuat satu dekrit resmi yang sama, namun ditulis menggunakan tiga aksara yang berbeda, yaitu aksara Hieroglif (digunakan oleh pendeta/negara), aksara Demotik (huruf sehari-hari masyarakat umum), dan aksara Yunani Kuno (bahasa administrasi dinasti Ptolemaik yang berkuasa saat itu). Berdasarkan keberadaan tiga sistem tulisan yang berbeda dalam satu dokumen resmi tersebut, simpulan logis mengenai kondisi masyarakat Mesir era Ptolemaik adalah...", "o": ["Adanya upaya sistematis penguasa untuk menghapus seluruh kebudayaan asli Mesir dan menggantinya dengan budaya asing", "Bahasa Yunani Kuno dipaksa menjadi satu-satunya bahasa lisan bagi seluruh penduduk asli di sepanjang lembah Sungai Nil", "Kaum pendeta kehilangan seluruh pengaruh politiknya karena sistem penulisan hieroglif tidak lagi diakui oleh negara", "Masyarakat Mesir Kuno mengalami kemunduran intelektual karena setiap warganya harus menghafal tiga sistem aksara sekaligus", "Terdapat stratifikasi sosial dan akulturasi budaya antara elit birokrat asing, golongan agamawan, dan masyarakat lokal setempat"], "a": 4, "p": "Tiga aksara dalam satu dekrit menggambarkan masyarakat berlapis: elit asing Yunani yang memerintah, pendeta, dan rakyat lokal. Ada stratifikasi sosial dan akulturasi budaya."}, {"q": "Bangsa Mesir Kuno merancang kalender matahari (solar calendar) yang terdiri dari 365 hari. Mereka membagi satu tahun menjadi 12 bulan (masing-masing 30 hari) ditambah 5 hari ekstra. Pembagian tahunnya secara ketat didasarkan pada tiga musim agraris yang selaras dengan alam: Akhet (musim banjir), Peret (musim tanam), dan Shemu (musim panen). Perhitungan kalender ini juga disinkronkan dengan kemunculan bintang Sirius (Sothis). Mengambil inspirasi dari cara bangsa Mesir mengintegrasikan astronomi dengan siklus pertanian, gagasan inovatif modern apa yang paling relevan untuk menjaga ketahanan pangan di era saat ini?", "o": ["Membangun kalender pertanian digital terpadu yang menyinkronkan data prediksi iklim satelit dengan otomatisasi jadwal masa tanam", "Memusatkan seluruh kegiatan produksi pangan hanya di satu kawasan pesisir pantai untuk secara mutlak menghindari kemarau panjang", "Mengganti sistem penanggalan masehi di seluruh dunia dengan sistem kalender bintang purba agar kualitas panen raya menjadi lebih baik", "Mengharuskan seluruh petani tradisional menggunakan alat ukur astronomi manual peninggalan masa lalu untuk menentukan waktu penyemaian", "Menolak keras penggunaan teknologi irigasi modern dan kembali sepenuhnya pada sistem pengairan tadah hujan secara alamiah"], "a": 0, "p": "Orang Mesir menyelaraskan astronomi (Sirius) dengan siklus tani. Gagasan modernnya adalah kalender tanam digital yang memadukan data iklim satelit dengan jadwal tanam."}, {"q": "Ekskavasi di kota kuno Mohenjo-Daro dan Harappa menunjukkan penataan kota yang sangat maju. Jalan-jalan utama dibangun lurus berpotongan membentuk sudut 90 derajat (sistem grid). Selain itu, batu bata bakar yang digunakan untuk pembangunan seluruh rumah dan infrastruktur publik memiliki rasio ukuran standar yang sangat seragam, yaitu 4:2:1 (panjang:lebar:tebal). Berdasarkan data tata letak kota dan rasio geometris batu bata tersebut, simpulan logis mengenai peradaban Lembah Sungai Indus adalah...", "o": ["Mengalami isolasi kebudayaan secara total dari pengaruh peradaban luar di kawasan Asia Selatan", "Memiliki sistem pemerintahan atau otoritas pusat yang kuat dalam mengatur standar tata ruang wilayah", "Mengandalkan tenaga kerja budak dari wilayah jajahan untuk mencetak batu bata secara manual", "Mendasarkan seluruh arsitektur bangunan sipil pada kepercayaan terhadap pergerakan rasi bintang", "Menolak penggunaan material alam yang kokoh demi menjaga aliran sungai agar tidak mengalami banjir"], "a": 1, "p": "Jalan grid dan batu bata berukuran seragam 4:2:1 tidak mungkin tanpa standar yang ditetapkan otoritas pusat yang kuat."}, {"q": "Peradaban Lembah Sungai Indus dikenal memiliki sistem sanitasi bawah tanah tertua dan paling efisien di dunia prasejarah. Hampir setiap rumah memiliki sumur air bersih dan saluran pembuangan limbah tertutup yang terbuat dari bata, yang terhubung langsung ke selokan utama di bawah jalan raya. Air limbah juga dilengkapi dengan bak resapan untuk mencegah pencemaran tanah. Berakar dari esensi pengelolaan sanitasi historis tersebut, gagasan tata kota modern yang relevan diaplikasikan untuk mengatasi masalah permukiman kumuh saat ini adalah...", "o": ["Membangun permukiman vertikal tanpa ventilasi udara agar lingkungan terhindar dari paparan polusi asap", "Memusatkan seluruh sumber air minum penduduk hanya pada satu sumur raksasa di tengah alun-alun kota", "Menciptakan sistem gorong-gorong terpadu yang memisahkan aliran air hujan dan limbah rumah tangga", "Mengharuskan seluruh penduduk membuang limbah harian langsung ke badan sungai untuk menghemat biaya", "Menutup total akses jalan bawah tanah untuk mencegah terjadinya pencemaran dari luapan air selokan"], "a": 2, "p": "Peradaban Indus memisahkan saluran limbah tertutup dari sumber air bersih. Gagasan modernnya adalah gorong-gorong terpadu yang memisahkan air hujan dan limbah rumah tangga."}, {"q": "Arkeolog menemukan artefak berupa batu timbangan berbentuk kubus di berbagai situs Lembah Sungai Indus. Timbangan ini memiliki sistem rasio biner dan desimal yang sangat presisi, dengan kelipatan 1, 2, 4, 8, 16, 32, hingga seterusnya. Di sisi lain, artefak stempel perniagaan berlogo hewan dari peradaban Indus juga banyak ditemukan dalam lapisan ekskavasi di wilayah Mesopotamia. Korelasi yang paling tepat antara penemuan sistem takaran matematis dan jejak stempel di luar negeri tersebut adalah...", "o": ["Bangsa Indus melakukan invasi militer demi memaksa Mesopotamia menggunakan sistem mata uang logam mereka", "Mesopotamia bertindak sebagai produsen utama batu timbangan bagi kegiatan pasar di seluruh Kota Harappa", "Peradaban Indus menguasai sistem monopoli perdagangan maritim global yang menyingkirkan para pelaut Eropa", "Terciptanya jaringan niaga antarbenua yang terstandarisasi dengan sistem takaran dan legitimasi administratif", "Timbangan kelipatan desimal digunakan semata-mata untuk mengukur jumlah harta kekayaan para dewa Indus"], "a": 3, "p": "Timbangan terstandar dan stempel Indus di Mesopotamia menunjukkan jaringan dagang antarwilayah dengan sistem takaran dan pengesahan administratif yang seragam."}, {"q": "Berbeda dengan huruf paku (cuneiform) dari Mesopotamia dan hieroglif dari Mesir yang telah berhasil diterjemahkan, tulisan piktograf dari peradaban Lembah Sungai Indus hingga saat ini masih menjadi misteri dan belum berhasil dipecahkan oleh para ahli bahasa. Karakter huruf ini umumnya hanya ditemukan berderet pendek pada stempel tanah liat. Evaluasi kritis terhadap dampak belum terpecahkannya aksara purba tersebut bagi penulisan historiografi peradaban India Kuno adalah...", "o": ["Ilmuwan secara bebas merekonstruksi sejarah sosial masyarakat tanpa harus membuktikan kebenarannya melalui fosil", "Pemahaman mengenai sistem kepercayaan, hukum tata negara, dan struktur politik sosial mereka masih bersifat interpretatif", "Penulisan catatan sejarah tentang peradaban ini dihentikan total hingga para arkeolog menemukan prasasti yang lebih panjang", "Seluruh teori mengenai keruntuhan kejayaan kota Harappa dibatalkan secara resmi oleh lembaga sejarah internasional", "Tulisan piktograf Indus kini dipastikan hanyalah motif dekoratif geometris acak tanpa memiliki makna kebahasaan sama sekali"], "a": 1, "p": "Karena aksaranya belum terbaca, pemahaman tentang kepercayaan, hukum, dan politik Indus hanya berupa tafsir (interpretatif) dari bukti arkeologis."}, {"q": "Selama puluhan tahun, teori invasi bangsa Arya sering dianggap sebagai penyebab utama keruntuhan peradaban Lembah Sungai Indus yang damai. Namun, penelitian paleoklimatologi dan geologi modern justru menemukan bukti adanya pergeseran lempeng tektonik yang mengubah aliran Sungai Ghaggar-Hakra (Saraswati) serta memicu masa kekeringan panjang pada periode sekitar 1900 SM. Bagaimana penemuan data sains ekologi alam tersebut mengevaluasi validitas historis dari teori invasi bangsa Arya?", "o": ["Membenarkan peristiwa invasi karena bangsa Arya membawa teknologi perusakan lingkungan yang sangat ekstrem ke India", "Membuktikan bahwa interaksi kedatangan bangsa Arya tidak memberikan dampak asimilasi apa pun pada peradaban tersebut", "Menegaskan bahwa masyarakat Indus memusnahkan diri mereka sendiri akibat penebangan hutan industri secara sistematis", "Menunjukkan kemunduran Harappa utamanya merupakan akibat kegagalan adaptasi sistem agraris terhadap bencana iklim", "Menyimpulkan bahwa seluruh penduduk asli Lembah Sungai Indus segera bermigrasi ke daratan Tiongkok secara paksa"], "a": 3, "p": "Bukti geologi dan iklim menunjukkan sungai berpindah dan kekeringan panjang. Kemunduran Harappa lebih tepat dijelaskan oleh kegagalan agraris beradaptasi dengan bencana iklim, bukan invasi Arya."}, {"q": "Lembah Sungai Kuning (Hwang Ho) menjadi pusat peradaban awal Tiongkok Kuno karena membawa endapan tanah loess yang sangat subur. Namun, sungai ini juga dijuluki sebagai \"Kesedihan Tiongkok\" (China's Sorrow) akibat siklus banjir bandangnya yang tidak menentu, yang sering menelan korban jiwa dan menghancurkan desa-desa agraris. Berdasarkan kondisi alam yang kontradiktif tersebut, korelasi geografi ini terhadap evolusi sistem sosial politik pada masa dinasti-dinasti awal Tiongkok adalah...", "o": ["Mendorong perpindahan seluruh pusat pemerintahan kekaisaran ke wilayah perbukitan tandus yang bebas bencana", "Memaksa masyarakat pedalaman untuk secara serentak meninggalkan tradisi agraris menuju perdagangan maritim laut", "Menstimulasi pembentukan otoritas pemerintahan terpusat yang kuat guna memobilisasi tenaga kerja pengendali banjir", "Memicu peperangan bersenjata antarpetani tanpa adanya campur tangan tata kelola dan perlindungan dari penguasa", "Menurunkan tingkat inovasi teknologi pertanian dan pengairan karena kepasrahan fatalistis terhadap siklus tahunan alam"], "a": 2, "p": "Banjir Sungai Kuning menuntut kerja massal mengendalikan air, dan itu hanya bisa dikerahkan oleh otoritas pemerintahan terpusat yang kuat."}, {"q": "Pada masa Dinasti Zhou (Periode Negara-Negara Berperang), Tiongkok Kuno melahirkan berbagai ajaran filsafat besar, salah satunya adalah Konfusianisme. Ajaran ini menekankan pentingnya moralitas pemimpin, keteladanan berbudi luhur, penghormatan kepada leluhur (bakti), serta kepatuhan pada tatanan hierarki sosial yang harmonis yang disebut sebagai Lima Hubungan. Mengambil esensi dari ajaran filsafat Konfusianisme tersebut, gagasan aplikatif yang dapat dirumuskan untuk menanggulangi krisis dekadensi moral di lingkungan sekolah modern saat ini adalah...", "o": ["Memberlakukan sistem hukuman fisik yang sangat berat dan tegas bagi setiap pelanggaran kecil tata tertib kedisiplinan", "Menerapkan kebebasan berekspresi mutlak bagi peserta didik untuk menentukan materi kurikulum dan hukum mereka sendiri", "Menghapuskan segala bentuk hierarki status antara guru dan siswa untuk menyamakan kedudukan sosial secara menyeluruh", "Mengintegrasikan pendidikan karakter berbasis keteladanan sikap pendidik dan penanaman budaya hormat secara berkelanjutan", "Memisahkan pengajaran akademis sains secara total dari unsur campur tangan pendidikan nilai-nilai etika budi pekerti"], "a": 3, "p": "Konfusianisme menekankan keteladanan pemimpin dan sikap hormat. Penerapannya di sekolah adalah pendidikan karakter berbasis keteladanan guru dan budaya hormat berkelanjutan."}, {"q": "Pada tahun 221 SM, Kaisar Qin Shi Huang berhasil menyatukan seluruh daratan Tiongkok di bawah kekuasaan Dinasti Qin. Untuk menjamin kelancaran roda ekonomi wilayah yang sangat luas tersebut, sang kaisar mengeluarkan dekrit standardisasi nasional terhadap sistem ukuran panjang (chi), satuan berat (jin), penulisan aksara, dan ukuran keping mata uang perunggu berlubang persegi (banliang). Jika tidak ada kebijakan penyatuan standar numerik dan alat ukur tersebut, dampak logis paling fatal yang akan mengancam kekaisaran adalah...", "o": ["Terjadinya eksploitasi berlebihan terhadap sumber daya tambang tembaga murni oleh kalangan kelas petani perdesaan", "Terhambatnya laju integrasi pasar nasional yang pada akhirnya memicu krisis ekonomi dan separatisme negara bawahan", "Munculnya sistem perekonomian barter yang justru membuat harga kebutuhan pokok masyarakat menjadi sangat stabil", "Berkembangnya sistem pencatatan literatur baru yang secara tata bahasa jauh lebih rumit di setiap perbatasan wilayah", "Runtuhnya dominasi kekuasaan militer pusat secara langsung akibat ketiadaan persenjataan logam yang berkualitas tinggi"], "a": 1, "p": "Tanpa standar ukuran, timbangan, dan mata uang, pasar nasional terhambat, ekonomi kacau, dan daerah bawahan cenderung memisahkan diri."}, {"q": "Jalur Sutra (Silk Road) yang dirintis secara intensif pada era Dinasti Han (206 SM - 220 M) membentang sejauh lebih dari 6.000 KM menghubungkan ibu kota Tiongkok dengan kawasan Asia Tengah, Timur Tengah, hingga ke perbatasan Kekaisaran Romawi. Jalur ini tidak sekadar menjadi rute distribusi sutra, porselen, dan rempah, tetapi menjelma menjadi saluran pertukaran kebudayaan antarbenua. Evaluasi bukti historis yang menunjukkan bahwa rentang rute sejauh ribuan kilometer tersebut berfungsi efektif sebagai jembatan interaksi peradaban global adalah...", "o": ["Penyatuan sistem pemerintahan monarki antara Kekaisaran Romawi dan Kekaisaran Han di bawah satu konstitusi hukum", "Penyebaran ajaran agama Buddha dari tanah kelahirannya di India masuk hingga meresap ke dalam tradisi dataran Tiongkok", "Penggantian bahasa resmi administratif Dinasti Han menggunakan dialek percakapan campuran dari para saudagar Persia", "Pemusnahan nilai filsafat lokal Tiongkok secara sistematis akibat masuknya aliran pemikiran ekstrem dari bangsa Eropa", "Penemuan kembali teknologi pembuatan kertas oleh ilmuwan Mediterania murni tanpa melibatkan kontak dagang Asia"], "a": 1, "p": "Jalur Sutra mengangkut gagasan juga, bukan hanya barang. Bukti nyatanya adalah masuknya agama Buddha dari India ke Tiongkok."}, {"q": "Konsep \"Mandat dari Langit\" (Tianming) pertama kali dicetuskan pada masa Dinasti Zhou untuk melegitimasi penggulingan penguasa Dinasti Shang sebelumnya. Doktrin kuno ini mengajarkan bahwa hak keilahian untuk memerintah diberikan oleh alam semesta hanya kepada pemimpin yang bermoral, adil, dan memikirkan rakyatnya. Jika penguasa bertindak zalim atau gagal mengatasi musibah kelaparan, maka mandat tersebut otomatis dicabut dan pemberontakan dari rakyat dianggap sebagai tindakan yang direstui alam. Evaluasi rasional dari fungsi utama diciptakannya doktrin politik tradisional ini adalah...", "o": ["Memberikan kekuasaan absolut tanpa batas kepada kaisar untuk bertindak sewenang-wenang merampas hak-hak komunal rakyat", "Menjadikan golongan agamawan sebagai pemegang kendali pemerintahan eksekutif tertinggi yang melampaui otoritas titah raja", "Menciptakan mekanisme pengawasan sosial dan pertanggungjawaban moral bagi penguasa dalam menjamin kesejahteraan rakyat", "Memisahkan urusan administrasi pemerintahan negara secara mutlak dari campur tangan sistem kepercayaan budaya tradisional", "Menjamin keberlangsungan takhta kekuasaan kaisar yang mengalir dalam satu garis keturunan genetik secara abadi tanpa syarat"], "a": 2, "p": "Mandat Langit menjadi alat kontrol moral: penguasa yang zalim kehilangan mandat, sehingga ia wajib menyejahterakan rakyat."}, {"q": "Kondisi alam Semenanjung Balkan yang menjadi pusat peradaban Yunani Kuno didominasi oleh perbukitan terjal, lembah yang sempit, dan garis pantai yang dipenuhi pulau-pulau kecil. Topografi bergunung-gunung ini membuat komunikasi lintas darat antarwilayah menjadi sangat sulit dilakukan pada masa prasejarah. Berdasarkan kondisi geografis tersebut, korelasi logis terhadap struktur politik peradaban Yunani Kuno adalah...", "o": ["Munculnya negara-kota (polis) yang memiliki sistem pemerintahan dan kemerdekaan mandiri", "Terbentuknya satu kekaisaran agraris terpusat yang mengatur seluruh wilayah semenanjung", "Pembangunan sistem jalan tol lintas pegunungan untuk menyatukan administrasi kerajaan", "Pemusatan kekuatan militer di satu lembah untuk menyerang peradaban Persia secara serentak", "Isolasi peradaban secara total yang menutup segala bentuk aktivitas perniagaan maritim"], "a": 0, "p": "Pegunungan dan pulau-pulau memisahkan wilayah, sehingga tiap lembah berkembang menjadi negara-kota (polis) yang merdeka."}, {"q": "Catatan demografi sejarawan memperkirakan bahwa pada abad ke-5 SM di Sparta, terdapat kelompok minoritas penguasa bernama Spartiate (warga negara penuh) yang jumlahnya hanya sekitar 8.000 jiwa. Mereka harus mengendalikan kelompok Helot (budak pertanian milik negara) yang populasinya diperkirakan mencapai lebih dari 100.000 jiwa. Berdasarkan ketimpangan rasio demografi antara penguasa dan golongan taklukan tersebut, evaluasi rasional terhadap sistem sosial politik yang diterapkan Sparta untuk mempertahankan negaranya adalah...", "o": ["Menghapuskan sistem perbudakan untuk menarik simpati dan dukungan politik dari para Helot", "Mengembangkan sistem demokrasi langsung agar setiap Helot memiliki hak suara di dewan kota", "Menerapkan sistem pemerintahan militeristik yang sangat ketat untuk mencegah pemberontakan", "Membagikan tanah pertanian secara merata kepada seluruh penduduk tanpa memandang status", "Membuka perbatasan negara seluas-luasnya bagi imigran asing untuk menambah jumlah pasukan"], "a": 2, "p": "Delapan ribu Spartiate menguasai lebih dari 100.000 Helot, sehingga Sparta menerapkan militerisme ketat agar pemberontakan dapat dicegah."}, {"q": "Athena sering diagungkan sebagai tempat kelahiran demokrasi langsung (direct democracy). Pada masa kepemimpinan Perikles, setiap pria dewasa yang merupakan warga negara asli Athena memiliki hak suara di Majelis (Eklesia) untuk berdebat dan menentukan undang-undang negara secara langsung. Evaluasi kritis terhadap kelemahan fundamental dari sistem demokrasi Athena jika ditinjau dari perspektif hak asasi modern adalah...", "o": ["Demokrasi hanya berfungsi secara efektif jika negara sedang dalam kondisi damai tanpa peperangan", "Keputusan majelis selalu ditentukan secara paksa oleh campur tangan dari dewa-dewi mitologi", "Kebebasan berpendapat dikendalikan sepenuhnya oleh kelompok militer elit berpangkat tinggi", "Otoritas pengambilan keputusan negara diserahkan kepada perwakilan yang dipilih secara acak", "Partisipasi politik bersifat sangat eksklusif karena meniadakan hak bagi perempuan dan budak"], "a": 4, "p": "Demokrasi Athena hanya untuk pria dewasa warga asli, sedangkan perempuan, budak, dan orang asing tidak punya hak politik. Ini bertentangan dengan HAM modern."}, {"q": "Filsuf Yunani Kuno, Sokrates, tidak pernah meninggalkan karya tulis tertulis. Ia mengajarkan filsafatnya melalui metode dialektika atau tanya jawab yang terus-menerus (metode Socratic). Alih-alih memberikan jawaban atau menceramahi muridnya, ia akan mengajukan pertanyaan-pertanyaan beruntun untuk mematahkan asumsi keliru dan menuntun sang murid menemukan kebenaran dari dalam pikirannya sendiri. Mengambil esensi dari pendekatan filsafat Sokrates tersebut, gagasan aplikatif yang paling tepat untuk diterapkan dalam metode pembelajaran di era modern adalah...", "o": ["Membiarkan peserta didik belajar secara mandiri di luar kelas tanpa ada bimbingan dari guru", "Menerapkan sistem ceramah satu arah agar materi tersampaikan lebih cepat kepada siswa", "Mengharuskan siswa menghafal seluruh buku teks sejarah untuk persiapan ujian akhir sekolah", "Menggunakan strategi diskusi interaktif yang memancing siswa menganalisis akar suatu masalah", "Memberikan nilai sempurna bagi siswa yang mampu meniru persis jawaban dari sang pendidik"], "a": 3, "p": "Metode Sokrates memancing siswa berpikir lewat tanya jawab. Padanannya adalah diskusi interaktif yang melatih analisis akar masalah."}, {"q": "Kuil Parthenon di perbukitan Akropolis Athena merupakan mahakarya arsitektur dunia purba. Penelitian para arsitek modern menunjukkan bahwa kuil ini dibangun mengacu pada rasio emas (golden ratio) dengan nilai pendekatan matematis 1,618. Lebar dan tinggi bangunan utama, spasi antar pilar, hingga tinggi dekorasi pilar pada fasad Parthenon selalu memiliki rasio pembagian yang mendekati angka tersebut guna menciptakan proporsi visual yang diklaim paling sempurna bagi mata manusia. Berdasarkan fakta pemanfaatan rasio emas ini, kesimpulan logis mengenai tingkat peradaban Yunani Kuno adalah...", "o": ["Arsitektur dibangun semata-mata mengandalkan intuisi seniman tanpa kaidah perhitungan ilmiah", "Estetika seni dan teknik sipil disatukan melalui landasan perhitungan geometri yang sangat presisi", "Pembangunan gedung keagamaan difokuskan pada kekuatan material dibanding nilai keindahan rupa", "Proporsi bangunan ditentukan oleh jumlah material batu marmer yang tersedia pada saat ekskavasi", "Rasio ukuran kuil diwajibkan selalu berubah-ubah setiap tahun mengikuti pergerakan rasi bintang"], "a": 1, "p": "Penggunaan rasio emas pada Parthenon menunjukkan bahwa seni dan teknik sipil dipadukan lewat perhitungan geometri yang presisi."}, {"q": "Pada masa awal Republik Romawi, kaum Plebeia (rakyat biasa) melakukan pemogokan besar dan mengancam akan meninggalkan kota Roma jika hak-hak mereka tidak diakui. Aksi ini memaksa kaum Patricia (bangsawan) menyusun Hukum Dua Belas Tabel (Lex Duodecim Tabularum) pada 450 SM. Hukum tertulis pertama Romawi ini diukir di lempengan perunggu dan dipajang di pusat kota (Forum Romanum) agar dapat dibaca oleh semua orang. Evaluasi kritis terhadap dampak pembuatan Hukum Dua Belas Tabel bagi dinamika sosial politik masyarakat Romawi adalah...", "o": ["Menciptakan kepastian hukum yang mencegah kesewenang-wenangan tafsir dari kaum bangsawan", "Memberikan jaminan kekebalan hukum secara absolut bagi seluruh warga miskin kota Roma", "Menetapkan kaum Plebeia sebagai pemegang kekuasaan tunggal dalam sistem kediktatoran", "Menghapuskan secara total perbedaan kelas sosial antara kaum Patricia dan kaum Plebeia", "Menjadikan hukum Romawi kehilangan wibawa karena bisa diubah sewaktu-waktu oleh rakyat"], "a": 0, "p": "Hukum Dua Belas Tabel dipajang untuk umum, sehingga kaum Patricia tidak bisa menafsirkan hukum sesuka hati. Hasilnya, kepastian hukum."}, {"q": "Insinyur Romawi membangun sistem akuaduk (saluran air) yang sangat canggih untuk menyuplai air bersih ke pemandian umum dan rumah penduduk. Salah satu akuaduk terpanjang, Aqua Marcia, dibangun pada 144 SM dengan panjang saluran mencapai sekitar 91 kilometer. Uniknya, hanya sekitar 8 KM dari saluran ini yang dibangun melayang di atas lengkungan jembatan batu (arches), sedangkan sisanya sepanjang 83 KM dibangun di bawah permukaan tanah. Berdasarkan perbandingan angka konstruksi tersebut, alasan teknis yang paling logis dari strategi pembangunan saluran bawah tanah yang sangat dominan adalah...", "o": ["Memaksimalkan tenaga para budak yang hanya memiliki keahlian dalam menggali sumur", "Mencegah runtuhnya jembatan lengkung akibat sering terjadinya gempa bumi vulkanik", "Menekan biaya produksi karena batu bata tidak lagi tersedia di sekitar wilayah semenanjung", "Menghindari penguapan air secara drastis serta mengamankan pasokan dari racun musuh", "Menyembunyikan cadangan air minum agar tidak dicuri oleh para pedagang dari luar negeri"], "a": 3, "p": "Saluran bawah tanah meminimalkan penguapan dan sulit diracuni atau dirusak musuh, sehingga pasokan air lebih aman."}, {"q": "Perang Punisia Kedua (218–201 SM) melibatkan pertempuran epik antara Republik Romawi dan Kartago. Jenderal Hannibal dari Kartago melakukan perjalanan logistik yang luar biasa dengan membawa puluhan ribu pasukan infanteri, kavaleri, dan 37 ekor gajah perang melintasi Pegunungan Alpen yang bersalju untuk menyerang Semenanjung Italia dari arah utara. Catatan sejarah menyebutkan bahwa setelah melewati kerasnya cuaca pegunungan, Hannibal kehilangan hampir separuh dari total pasukannya dan hanya menyisakan beberapa ekor gajah. Berdasarkan analisis data kuantitatif kerugian logistik tersebut, simpulan logis mengenai strategi militer Hannibal adalah...", "o": ["Gajah perang terbukti sebagai hewan yang paling tangguh di wilayah beriklim es ekstrem", "Hannibal lebih mengutamakan pameran jumlah pasukan dibandingkan memenangkan pertempuran", "Perhitungan rute perjalanan didasarkan pada keinginan untuk menguji ketahanan fisik prajurit", "Romawi telah mempersiapkan jebakan alam di pegunungan untuk menghancurkan pasukan musuh", "Serangan kejutan dianggap lebih bernilai taktis meskipun harus menanggung penyusutan pasukan"], "a": 4, "p": "Hannibal menerima kehilangan hampir separuh pasukan demi mengejutkan Romawi dari utara, sehingga ia menilai efek kejutan lebih bernilai taktis."}, {"q": "Periode Pax Romana (Kedamaian Romawi) yang berlangsung selama kurang lebih dua abad sejak masa Kaisar Augustus ditandai dengan stabilitas yang belum pernah terjadi sebelumnya. Pada masa ini, kekaisaran gencar membangun jaringan jalan raya berbatu (viae) super lurus yang menghubungkan seluruh provinsi, mulai dari Britania hingga Mesopotamia, dengan semboyan \"Semua jalan menuju Roma\". Evaluasi dampak paling esensial dari masifnya pembangunan infrastruktur jalan tersebut terhadap integrasi wilayah kekaisaran adalah...", "o": ["Membatasi pergerakan warga sipil yang ingin bermigrasi mencari pekerjaan di luar tanah kelahirannya", "Mempercepat mobilitas legiun militer sekaligus membuka arus perniagaan budaya ekonomi antarprovinsi", "Mengubah fungsi utama seluruh pasukan militer Romawi menjadi sekadar pekerja konstruksi bangunan sipil", "Menghancurkan kebudayaan lokal daerah taklukan karena dipaksa meniru mentah-mentah arsitektur ibu kota", "Menjadikan kota Roma sebagai satu-satunya tempat yang diizinkan untuk melakukan transaksi jual beli"], "a": 1, "p": "Jalan raya mempercepat gerak legiun dan membuka arus perdagangan serta budaya antarprovinsi, sehingga wilayah kekaisaran terintegrasi."}, {"q": "Runtuhnya sistem tata negara Republik Romawi dan transisinya menjadi Kekaisaran Romawi berawal dari krisis kepatuhan institusi. Para jenderal populer seperti Julius Caesar mulai menggunakan legiun militer yang digajinya sendiri yang setia kepada sang jenderal secara pribadi, bukan kepada negara untuk memperebutkan kekuasaan politik di ibu kota. Senat Romawi yang korup gagal mempertahankan konstitusi, sehingga lahirnya kediktatoran militer tidak terhindarkan. Mengambil pelajaran dari keruntuhan sistem republik di masa kuno tersebut, gagasan konstitusional modern apa yang wajib ditegakkan untuk menjaga kelangsungan sebuah negara demokrasi saat ini?", "o": ["Menegakkan supremasi sipil di mana seluruh institusi angkatan bersenjata harus tunduk pada otoritas negara", "Membatasi jumlah warga negara yang memiliki hak pilih di dalam setiap kegiatan pemilihan umum", "Menerapkan sistem di mana seorang pemimpin politik sipil wajib merangkap sebagai jenderal angkatan darat", "Menghapuskan lembaga perwakilan rakyat agar proses pengambilan keputusan politik menjadi jauh lebih cepat", "Menyerahkan seluruh pengadilan hukum tata negara sepenuhnya kepada panglima tertinggi militer"], "a": 0, "p": "Republik runtuh karena militer setia pada jenderal, bukan negara. Pelajarannya, supremasi sipil harus ditegakkan: militer tunduk pada otoritas negara."}, {"q": "Peradaban Maya di Meso-Amerika mengembangkan sistem matematika berbasis 20 (vigesimal) dan telah mengenal konsep angka nol sejak awal perkembangannya. Kemampuan matematis tingkat tinggi ini diaplikasikan untuk menyusun sistem penanggalan Haab (kalender matahari) yang sangat akurat, terdiri dari 365 hari yang terbagi menjadi 18 bulan dengan masing-masing 20 hari, ditambah 5 hari ekstra. Evaluasi kritis terhadap relasi antara penguasaan sistem numerik purba ini dengan kelangsungan peradaban agraris Maya adalah...", "o": ["Membantu kelompok elit bangsawan memprediksi kedatangan bangsa Eropa melalui ramalan bintang", "Memungkinkan perhitungan presisi terkait siklus musim tanam dan jadwal pelaksanaan ritual persembahan", "Mendorong penemuan sistem perdagangan barter menggunakan koin logam mulia dengan pecahan basis dua puluh", "Mempermudah pengukuran jarak antarkota pesisir untuk keperluan ekspansi militer ke luar benua Amerika", "Menciptakan standardisasi ukuran batu bata secara nasional untuk membangun seluruh rumah penduduk sipil"], "a": 1, "p": "Sistem angka vigesimal dan kalender Haab memungkinkan Maya menghitung musim tanam dan jadwal ritual dengan presisi."}, {"q": "Suku Aztec membangun ibu kota Tenochtitlan di sebuah pulau di tengah Danau Texcoco. Untuk mengatasi keterbatasan lahan pertanian akibat bentang alam berupa perairan dangkal tersebut, mereka menciptakan inovasi teknologi chinampas, yaitu kebun terapung buatan dari anyaman ranting dan alang-alang yang ditimbun lumpur organik subur. Hasil panen dari sistem chinampas ini sangat berlimpah dan mampu menghidupi ratusan ribu penduduk kota. Mengambil inspirasi dari inovasi pertanian kuno tersebut, gagasan aplikatif yang paling relevan untuk mengatasi krisis lahan dan ketahanan pangan di area perkotaan modern yang padat penduduk adalah...", "o": ["Membangun sistem pertanian hidroponik atau urban farming terpadu dengan memaksimalkan lahan sempit di atap gedung", "Mencetak sawah lahan basah berskala besar dengan cara menimbun seluruh wilayah pesisir laut dan muara sungai", "Memindahkan paksa seluruh penduduk kota besar ke wilayah pegunungan pinggiran yang masih memiliki banyak hutan", "Menghentikan produksi sektor industri pabrik untuk dihancurkan dan dikembalikan fungsinya menjadi area perkebunan", "Mengimpor seluruh kebutuhan bahan makanan pokok dari negara berkembang agar warga kota fokus pada sektor jasa"], "a": 0, "p": "Chinampas memaksimalkan lahan terbatas untuk pangan. Padanan modernnya adalah urban farming atau hidroponik di lahan sempit seperti atap gedung."}, {"q": "Peradaban Olmec yang berkembang di pesisir Teluk Meksiko sekitar tahun 1200-400 SM sering diidentifikasi oleh para arkeolog sebagai kebudayaan induk (Mother Culture) bagi kawasan Meso-Amerika. Artefak peninggalan mereka, seperti patung kepala batu raksasa, lapangan permainan bola karet (pok-ta-pok), dan struktur piramida berundak, banyak ditemukan jejak kemiripan dan modifikasinya pada peradaban Maya dan Aztec yang muncul ratusan hingga ribuan tahun setelahnya. Analisis logis mengenai dinamika pewarisan kebudayaan di Meso-Amerika berdasarkan fakta arkeologis tersebut adalah...", "o": ["Bangsa Olmec menaklukkan suku Maya dan Aztec secara militer lalu mendiktekan kebudayaan mereka secara paksa", "Masyarakat Maya dan Aztec memiliki leluhur biologis dari luar benua Amerika yang singgah di wilayah Meksiko", "Terjadi kesinambungan tradisi di mana peradaban penerus mengadopsi serta menyempurnakan fondasi budaya pendahulunya", "Permainan bola karet diciptakan murni sebagai sarana hiburan sekuler tanpa memiliki kaitan dengan ritual pengorbanan", "Komunitas kuno di benua Amerika berkembang secara terisolasi satu sama lain tanpa adanya interaksi lintas generasi"], "a": 2, "p": "Kemiripan artefak (kepala batu, permainan bola, piramida berundak) menunjukkan kesinambungan budaya: pewaris mengadopsi dan menyempurnakan warisan Olmec."}, {"q": "Piramida El Castillo (Kuil Kukulcan) di situs Chichen Itza dirancang secara presisi matematis oleh arsitek peradaban Maya. Bangunan ini memiliki empat sisi tangga dengan masing-masing 91 anak tangga. Jika seluruh anak tangga tersebut dijumlahkan beserta satu pelataran puncaknya, akan menghasilkan angka 365. Selain itu, pada saat ekuinoks musim semi dan gugur, bayangan sinar matahari menciptakan ilusi visual berbentuk tubuh ular yang merayap turun dari puncak piramida. Penilaian kritis terhadap corak peradaban bangsa Maya berdasarkan bukti fenomena monumen tersebut adalah...", "o": ["Arsitektur monumental dibangun semata-mata untuk menunjukkan kediktatoran kekuasaan militer raja kepada rakyat jelata", "Seluruh anak tangga difungsikan secara harfiah sebagai sistem jam matahari yang harus dinaiki warga setiap hari secara bergiliran", "Ilusi optik bayangan matahari merupakan sebuah kebetulan alamiah yang tidak pernah direncanakan oleh para insinyur pembangunannya", "Pembangunan kuil raksasa bertujuan utama untuk menakut-nakuti penjajah asing agar mengira kota dijaga oleh dewa monster", "Bangunan suci didesain menggunakan perpaduan ilmu astronomi geometri yang terintegrasi erat dengan mitologi peribadatan"], "a": 4, "p": "Anak tangga berjumlah 365 dan bayangan ular saat ekuinoks menunjukkan perpaduan astronomi, geometri, dan mitologi dalam bangunan suci."}, {"q": "Ketika pasukan ekspedisi Spanyol pimpinan Hernan Cortes mendarat di Meksiko pada tahun 1519, jumlah tentara conquistador tersebut hanya berkisar 600 orang. Namun, dalam rentang waktu kurang dari tiga tahun, mereka berhasil meruntuhkan total Kekaisaran Aztec yang memiliki populasi jutaan jiwa dengan ratusan ribu prajurit tempur elit. Ditinjau dari perbandingan rasio jumlah pasukan militer yang sangat timpang tersebut, analisis penyebab historis paling krusial yang mempercepat kejatuhan ibu kota Tenochtitlan adalah...", "o": ["Gabungan penyebaran wabah penyakit cacar yang mematikan dari Eropa dan persekutuan militer bangsa Spanyol dengan suku-suku lokal", "Penyerahan diri takhta kaisar Aztec secara sukarela akibat keputusasaan melihat persenjataan meriam modern yang dibawa oleh pendatang", "Penerapan taktik bumi hangus oleh prajurit pribumi yang justru meluluhlantakkan cadangan logistik pertahanan kota mereka sendiri", "Terjadinya bencana alam tsunami berskala besar yang secara kebetulan tepat menghancurkan kekuatan maritim pertahanan perairan danau", "Ketiadaan sistem komando peperangan darat yang terstruktur di dalam hierarki militer pasukan elit pelindung istana kaisar Montezuma"], "a": 0, "p": "Dengan 600 prajurit, kemenangan Spanyol terutama karena wabah cacar yang melemahkan Aztec dan aliansi dengan suku-suku lokal yang memusuhi Aztec."}, {"q": "Peradaban Inka di Pegunungan Andes berhasil mengelola tata administrasi kekaisaran yang membentang sejauh ribuan kilometer meski sama sekali tidak memiliki sistem tulisan (aksara). Sebagai gantinya, mereka menggunakan Quipu, yakni instrumen kumpulan tali berwarna dengan simpul-simpul yang diikat secara spesifik. Sistem ini menerapkan logika matematika desimal (basis 10), di mana posisi simpul dari bawah ke atas pada untaian tali secara berurutan mewakili nilai satuan, puluhan, ratusan, hingga ribuan. Alat ini difungsikan secara ketat oleh aparatur negara (Quipucamayoc) untuk merekam data sensus penduduk, cadangan hasil panen, hingga inventaris logistik militer. Mengambil esensi dari fungsi Quipu sebagai instrumen perekam data non-kertas tersebut, gagasan teknologi masa kini yang memiliki prinsip dasar pengkodean paling selaras dengan cara kerja alat kuno bangsa Inka adalah...", "o": ["Menciptakan sistem basis data komputasi yang menyimpan ragam informasi sangat kompleks melalui susunan pengkodean biner", "Membangun perpustakaan fisik berskala nasional untuk mengamankan seluruh lembaran arsip dokumen kertas pemerintahan", "Menerapkan pengiriman pesan darurat maritim melalui penggunaan instrumen komunikasi sandi morse berbasis kedipan cahaya", "Mewajibkan tradisi penghafalan laporan perpajakan secara lisan bagi seluruh aparatur pembukuan negara di daerah terpencil", "Memanfaatkan teknologi mesin cetak manual untuk memproduksi buku pedoman hukum pidana ke seluruh pelosok ibu kota"], "a": 0, "p": "Quipu menyimpan data lewat kombinasi simpul (kode posisi). Prinsip serupa dipakai basis data komputer yang menyimpan informasi dengan kode biner."}, {"q": "Pada Abad Pertengahan, karya seni di Eropa umumnya bersifat teosentris, kaku, dan semata-mata ditujukan untuk kepentingan keagamaan. Namun, memasuki era Renaissance, seniman seperti Leonardo da Vinci menciptakan lukisan \"Vitruvian Man\" yang menggambarkan proporsi anatomi tubuh manusia secara matematis dan realistis. Di bidang sastra, karya-karya bermunculan dengan mengusung tema emosi dan potensi manusia. Berdasarkan perbandingan karakteristik karya tersebut, perubahan paradigma paling mendasar yang menandai era Renaissance di Eropa adalah...", "o": ["Pembatasan kebebasan individu dalam mengekspresikan karya seni berskala internasional", "Pemusnahan seluruh karya seni peninggalan Abad Pertengahan oleh para cendekiawan rasionalis", "Pengembalian sistem politik kekaisaran Romawi Kuno secara utuh di seluruh wilayah benua Eropa", "Penolakan mutlak terhadap keberadaan institusi keagamaan dalam mengatur sistem ketatanegaraan", "Peralihan pusat pemikiran dari nilai-nilai ketuhanan yang dogmatis menjadi potensi akal budi manusia"], "a": 4, "p": "Seni Renaissance beralih dari dogma teosentris ke humanisme: pusat pemikiran bergeser pada potensi akal budi manusia."}, {"q": "Sebuah negara penganut merkantilisme pada abad ke-17 mencatat neraca perdagangan tahunan sebagai berikut: total nilai ekspor komoditas manufaktur sebesar 450 ton emas, sedangkan total pengeluaran impor untuk bahan mentah dan barang mewah mencapai 600 ton emas. Berdasarkan kalkulasi neraca perdagangan tersebut, langkah strategis yang paling sejalan dengan doktrin merkantilisme untuk memperbaiki kondisi negara itu adalah...", "o": ["Membuka pasar domestik secara bebas untuk mempermudah masuknya barang dari wilayah luar", "Meminjam cadangan emas dari negara pesaing utama guna menutupi angka defisit neraca tahunan", "Menerapkan kebijakan proteksionisme tinggi dan memonopoli sumber daya alam dari wilayah koloni", "Menghentikan perdagangan internasional secara total agar kas perbendaharaan negara tidak kehabisan", "Mengurangi bea cukai barang asing agar harga kebutuhan pokok di dalam negeri menjadi lebih terjangkau"], "a": 2, "p": "Neraca defisit (ekspor 450 < impor 600). Merkantilisme menjawabnya dengan proteksionisme dan monopoli sumber daya koloni agar emas bertambah."}, {"q": "Penemuan mesin cetak dengan huruf lepas (movable type) oleh Johannes Gutenberg pada pertengahan abad ke-15 memungkinkan buku-buku yang sebelumnya disalin secara manual dengan harga mahal, diproduksi massal secara murah. Hal ini memicu revolusi informasi di Eropa, di mana gagasan humanis Renaissance dan ilmu pengetahuan menyebar dengan kecepatan yang sangat eksponensial. Mengambil esensi dari fenomena sejarah penyebaran literasi tersebut, gagasan inovatif masa kini yang paling relevan untuk memberantas ketimpangan akses informasi di daerah pelosok adalah...", "o": ["Membangun perpustakaan megah di pusat kota besar dengan koleksi manuskrip kuno berbahasa asing", "Mendatangkan para pakar pendidikan luar negeri untuk mendiktekan materi secara langsung kepada siswa", "Mengembangkan platform perpustakaan digital luring berbasis server lokal yang diakses tanpa kuota internet", "Menghapus buku cetak fisik dari peredaran dan menerapkan metode hafalan pelajaran secara komunal massal", "Mewajibkan seluruh masyarakat desa membeli perangkat keras cerdas keluaran paling mutakhir dari luar negeri"], "a": 2, "p": "Mesin cetak membuat informasi murah dan tersebar luas. Padanan modernnya adalah perpustakaan digital luring berbasis server lokal tanpa kuota internet."}, {"q": "Pada masa kejayaan merkantilisme, perusahaan kongsi dagang VOC diberikan hak oktroi oleh pemerintah Belanda. Tercatat antara tahun 1602 hingga 1696, VOC rata-rata membagikan dividen tahunan dengan rasio persentase sebesar 12 hingga 50 persen kepada para pemegang saham utamanya. Angka ini jauh melampaui tingkat suku bunga wajar perbankan pada masa itu. Berdasarkan besaran persentase dividen dan sistem kerja kongsi tersebut, simpulan analitis mengenai corak praktik merkantilisme VOC di Nusantara adalah...", "o": ["Kesejahteraan ekonomi didistribusikan secara merata kepada seluruh penduduk di daerah penanaman modal", "Keuntungan maksimal dicapai melalui mekanisme pasar dagang bebas yang sangat sehat dan kompetitif", "Pemerintah kolonial mengalokasikan hasil dividen tahunan murni untuk membangun infrastruktur lokal", "Penumpukan kekayaan korporasi negara diwujudkan melalui jalur eksploitasi dan monopoli harga yang mutlak", "Tingkat suku bunga ditekan serendah mungkin untuk memberikan bantuan modal bagi para petani rempah"], "a": 3, "p": "Dividen 12–50% bersumber dari hak oktroi dan monopoli VOC. Keuntungan kongsi lahir dari eksploitasi dan monopoli harga, bukan pasar bebas."}, {"q": "Era Renaissance melahirkan semangat inkuiri (keingintahuan kritis) yang menantang dogma-dogma geografi kuno. Hal ini memicu rentetan inovasi di bidang kartografi, penyempurnaan kompas magnetik, dan perancangan kapal laut jenis karavel. Perkembangan pesat ilmu pengetahuan empiris ini kemudian membuka jalan bagi Era Penjelajahan Samudra. Begitu rute ke benua baru terbuka, negara-negara Eropa segera menerapkan sistem ekonomi merkantilisme yang ketat. Mengevaluasi rantai peristiwa tersebut, pernyataan yang paling tepat menggambarkan relasi historis antara Renaissance dan Merkantilisme adalah...", "o": ["Kedua era tersebut berkembang dan berakhir secara bersamaan tanpa memiliki ikatan hukum sebab akibat", "Kemajuan pemikiran rasional empiris memfasilitasi instrumen lahirnya praktik ekspansi ekonomi merkantilisme", "Merkantilisme menjadi syarat utama yang harus diberlakukan secara ketat sebelum gagasan humanisme dapat dipelajari", "Penjelajahan samudra mematikan seluruh aktivitas seni rupa dan pemikiran filosofis secara drastis di benua Eropa", "Praktik merkantilisme menolak keras penggunaan perangkat teknologi navigasi hasil ciptaan para ilmuwan rasionalis"], "a": 1, "p": "Semangat inkuiri Renaissance melahirkan navigasi dan kartografi, yang membuka penjelajahan samudra dan memfasilitasi ekspansi ekonomi merkantilisme."}, {"q": "Pada tahun 1517, Martin Luther memaku 95 Tesis di pintu Gereja Wittenberg. Salah satu kritik terbesarnya ditujukan pada praktik penjualan surat pengampunan dosa (indulgensi). Pihak gereja mengklaim bahwa dengan membeli surat tersebut, masa hukuman jiwa di api penyucian dapat dikurangi. Sebaliknya, Luther berargumen berdasarkan kajian teologisnya bahwa keselamatan jiwa manusia hanya dapat diperoleh melalui iman semata (sola fide) dan rahmat Tuhan, bukan melalui perbuatan atau transaksi materi. Berdasarkan narasi tersebut, analisis akar permasalahan teologis yang mendasari protes Martin Luther terhadap otoritas gereja adalah...", "o": ["Agama diubah menjadi komoditas ekonomi yang memanipulasi ketakutan umat manusia", "Doktrin keselamatan hanya dapat dicapai melalui ritual ibadah harian yang sangat ketat", "Pembangunan gereja megah tidak lagi melibatkan tenaga kerja dari kalangan rakyat miskin", "Pemimpin agama kehilangan hak politiknya di dalam struktur pemerintahan monarki absolut", "Tradisi penyebaran ajaran secara lisan tidak lagi diakui sebagai sumber utama hukum kanonik gereja"], "a": 0, "p": "Luther menolak indulgensi karena agama dijadikan komoditas ekonomi yang memanfaatkan ketakutan umat, padahal keselamatan hanya lewat iman dan rahmat."}, {"q": "Penemuan mesin cetak dengan huruf lepas oleh Johannes Gutenberg memainkan peran krusial dalam Reformasi Gereja. Sebelum ada mesin cetak, penyalinan sebuah Alkitab membutuhkan waktu berbulan-bulan dengan biaya setara 3 tahun upah seorang pekerja biasa. Namun, pada dekade 1520-an, pamflet dan terjemahan Alkitab karya Martin Luther dicetak ratusan ribu eksemplar, dengan harga jual sebuah pamflet turun drastis hingga hanya setara 1 hari upah buruh. Berdasarkan perbandingan angka biaya produksi dan waktu tersebut, evaluasi dampak paling revolusioner dari teknologi mesin cetak terhadap keberhasilan Reformasi Gereja adalah...", "o": ["Memusatkan seluruh produksi literatur agama di ibu kota kekaisaran yang dikontrol secara ketat", "Mendemokratisasi akses informasi sehingga gagasan teologi baru tidak dapat dimonopoli penguasa", "Menghancurkan industri pembuatan kertas tradisional yang selama ini dikuasai oleh kaum bangsawan", "Menjadikan para pendeta sebagai satu-satunya kelompok yang mampu mengoperasikan mesin tersebut", "Menurunkan minat baca masyarakat karena harga buku teks ilmiah tetap tidak terjangkau kaum buruh"], "a": 1, "p": "Biaya cetak yang turun drastis menyebarkan pamflet dan Alkitab ke banyak orang, sehingga informasi teologi baru tidak bisa dimonopoli gereja atau penguasa."}, {"q": "Berbeda dengan Reformasi di wilayah Jerman yang dipelopori oleh para teolog, Reformasi di Inggris justru dipelopori oleh raja yang berkuasa. Raja Henry VIII memisahkan Inggris dari otoritas kepausan di Roma karena Paus menolak membatalkan pernikahan Henry dengan Catherine dari Aragon. Melalui Undang-Undang Supremasi (Act of Supremacy) pada tahun 1534, parlemen menetapkan bahwa Raja Inggris adalah kepala tertinggi dari Gereja Inggris (Anglikan). Analisis korelasi logis antara kepentingan dinasti monarki dan gerakan reformasi keagamaan di Inggris berdasarkan peristiwa tersebut adalah...", "o": ["Agama digunakan sebagai instrumen diplomasi militer untuk menaklukkan negara-negara Eropa daratan", "Hukum kanonik peradilan gereja secara mutlak menggantikan seluruh hukum perdata warisan peradaban Romawi", "Kekuasaan gereja harus dihilangkan secara total agar seluruh masyarakat diwajibkan beralih pada ateisme negara", "Otoritas keagamaan diintegrasikan ke dalam struktur institusi negara demi memperkuat legitimasi kekuasaan politik raja", "Perubahan teologi merupakan syarat mutlak bagi sebuah kerajaan untuk menjalin kerja sama niaga dengan saudagar asing"], "a": 3, "p": "Raja Inggris menjadi kepala gereja lewat Act of Supremacy (1534). Otoritas agama menyatu dalam negara untuk memperkuat legitimasi politik raja."}, {"q": "Sebagai tanggapan terhadap meluasnya gerakan Protestan, Gereja Katolik Roma mengadakan Konsili Trente (1545-1563). Dalam konsili ini, gereja mengambil langkah tegas untuk menghapuskan praktik korupsi di kalangan klerus, melarang penjualan indulgensi, dan mendirikan seminari untuk mendidik para imam agar lebih berkualitas. Namun di sisi lain, gereja tetap mempertahankan dogma fundamentalnya, seperti supremasi Paus, tradisi gereja sebagai sumber otoritas setara Alkitab, serta doktrin keselamatan melalui iman dan perbuatan baik. Evaluasi rasional mengenai strategi pertahanan institusi Gereja Katolik (Kontra-Reformasi) tersebut adalah...", "o": ["Akomodasi penuh terhadap tuntutan kelompok reformator dengan mengubah sistem teologi secara mendasar", "Kompromi politik transaksional yang memberikan kebebasan mutlak bagi setiap negara memilih ajaran agamanya", "Pemisahan wilayah kekuasaan secara damai antara wilayah penganut Katolik di utara dan Protestan di selatan", "Pemurnian moral aparatur keagamaan tanpa merombak sedikit pun doktrin teologis yang telah diyakini selama berabad-abad", "Penghancuran seluruh fasilitas peribadatan milik kelompok penentang melalui agresi penaklukan militer terbuka"], "a": 3, "p": "Konsili Trente membersihkan korupsi dan memperbaiki pendidikan imam, tetapi tetap mempertahankan seluruh dogma. Itu pemurnian moral tanpa perubahan doktrin."}, {"q": "Perang Tiga Puluh Tahun (1618–1648) yang meluluhlantakkan wilayah Eropa berawal dari sentimen konflik agama antara kubu Katolik dan Protestan. Perang ini diakhiri oleh Perjanjian Westphalia (1648), yang melahirkan prinsip kedaulatan negara modern. Salah satu poin utamanya menetapkan bahwa kedaulatan wilayah harus dihormati dan penguasa dari negara lain tidak boleh campur tangan dalam urusan domestik, termasuk dalam urusan keyakinan warga negara masing-masing. Mengambil esensi dari penyelesaian konflik agama melalui Perjanjian Westphalia tersebut, gagasan tata kelola hubungan antarnegara yang paling tepat untuk mencegah krisis identitas di era modern adalah...", "o": ["Memaksa seluruh warga negara dunia menganut satu kepercayaan yang sama dengan mayoritas negara adidaya penguasa ekonomi", "Menghapus batas negara dan identitas kebudayaan lokal agar tercipta struktur masyarakat global yang homogen tanpa perbedaan", "Menjunjung tinggi kedaulatan wilayah dengan prinsip non-intervensi sembari menghormati kemajemukan budaya internal masing-masing", "Menyerahkan urusan keamanan dan ketertiban daerah konflik multietnis kepada dominasi lembaga agama internasional secara mutlak", "Mewajibkan pembentukan zona penyangga pertahanan militer di setiap wilayah perbatasan yang memiliki perbedaan ras dan etnis bawaan"], "a": 2, "p": "Westphalia menegaskan kedaulatan wilayah dan non-intervensi. Pelajarannya, hormati kedaulatan dan kemajemukan budaya internal tiap negara."}, {"q": "Filsuf Jerman, Immanuel Kant, merumuskan semboyan Aufklärung yang berbunyi \"Sapere Aude!\" (Beranilah berpikir sendiri!). Sebelum era Pencerahan, masyarakat Eropa cenderung terkungkung oleh otoritas institusi keagamaan dan tradisi feodal yang mendikte hampir segala aspek kehidupan sosial dan kebudayaan. Bagaimana semboyan rasionalisme ini mengevaluasi pergeseran paradigma intelektual peradaban Eropa pada abad ke-18?", "o": ["Penyatuan berbagai pemikiran filsafat Eropa diikat ke dalam sebuah konstitusi monarki absolut", "Kebebasan menggunakan akal budi menjadi fondasi utama untuk melepaskan diri dari dogma", "Penghapusan sistem pendidikan formal digantikan oleh metode pembelajaran alamiah mandiri", "Penolakan secara kekerasan terhadap institusi kerajaan diwajibkan bagi seluruh warga negara", "Legitimasi kekuasaan politik diserahkan sepenuhnya kepada kelompok ilmuwan dan akademisi"], "a": 1, "p": "Sapere Aude berarti berani berpikir sendiri. Akal budi menjadi dasar utama lepas dari dogma dan tradisi feodal."}, {"q": "Penemuan mesin uap oleh James Watt pada tahun 1769 merevolusi industri tekstil Inggris. Sebelum mekanisasi, seorang pemintal tradisional hanya mampu mengolah rata-rata 1 gulung benang dalam sehari. Setelah menggunakan mesin pemintal bertenaga uap, kapasitas produksi satu orang pekerja melonjak tajam menjadi 50 hingga 100 gulung benang per hari. Evaluasi dampak ekonomi paling signifikan dari lonjakan angka kapasitas produksi tersebut terhadap dominasi dagang Inggris di dunia adalah...", "o": ["Melimpahnya komoditas manufaktur murah yang membanjiri pasar internasional", "Hancurnya industri kain domestik karena masyarakat beralih menggunakan kulit", "Berkurangnya kebutuhan bahan mentah kapas dari wilayah tanah jajahan di Asia", "Menurunnya tingkat kesejahteraan para pemilik modal akibat tingginya biaya mesin", "Terhentinya laju ekspor tekstil karena Inggris berfokus pada swasembada pangan"], "a": 0, "p": "Produksi per pekerja naik 50–100 kali lipat, sehingga barang manufaktur murah membanjiri pasar internasional dan memperkuat dominasi dagang Inggris."}, {"q": "Transisi dari sistem industri rumahan (gilda) menuju sistem pabrik memunculkan golongan buruh upahan (proletar). Kondisi kerja perkotaan yang buruk, jam kerja yang mencapai 16 jam sehari, serta ancaman pemutusan hubungan kerja memicu munculnya gerakan Luddite pada awal abad ke-19, di mana para pekerja secara rahasia menghancurkan mesin-mesin pabrik. Berdasarkan narasi historis tersebut, korelasi logis yang melatarbelakangi aksi radikal para buruh terhadap alat produksi adalah...", "o": ["Ambisi buruh untuk mengambil alih hak kepemilikan pabrik secara konstitusional", "Desakan pemerintah untuk memodernisasi peralatan pabrik yang sudah terlalu usang", "Kesepakatan rahasia antara pemilik modal dan buruh untuk menaikkan harga jual pasar", "Frustrasi akibat alienasi tenaga kerja dan ancaman hilangnya sumber mata pencaharian", "Penolakan mayoritas masyarakat terhadap barang manufaktur yang dianggap tidak suci"], "a": 3, "p": "Luddite menghancurkan mesin karena frustrasi: kerja teralienasi dan sumber penghidupan terancam oleh mekanisasi."}, {"q": "Revolusi Industri tidak hanya mengubah struktur sosial ekonomi domestik Eropa, tetapi juga bertindak sebagai katalis pemicu gelombang Imperialisme Modern pada paruh kedua abad ke-19. Negara-negara industri Eropa mulai melakukan ekspansi agresif, bersaing memperebutkan wilayah kekuasaan di benua Afrika dan Asia. Evaluasi kritis mengenai hubungan sebab-akibat antara mekanisasi industri dengan lahirnya kebijakan kolonial modern tersebut adalah...", "o": ["Kebutuhan mutlak terhadap pasar baru dan sumber pasokan bahan mentah murah", "Industri sangat membutuhkan tempat pembuangan limbah beracun di benua lain", "Ekspansi dilakukan murni untuk menyebarkan teknologi mesin uap secara gratis", "Negara industri ingin memindahkan seluruh populasinya ke benua yang lebih hangat", "Persaingan antarnegara Eropa hanya berfokus pada pencarian tenaga kerja terdidik"], "a": 0, "p": "Industri butuh pasar baru dan bahan mentah murah, sehingga negara industri berekspansi ke Afrika dan Asia dalam imperialisme modern."}];

function confirmFin(){
 var a=Object.keys(S.ans).length,f=Object.keys(S.fl).length,n=S.ord.length;
 var m=modal('<h1>Kumpulkan jawaban?</h1><p>Terjawab: <b>'+a+'</b> · Belum: <b>'+(n-a)+'</b> · Ragu-ragu: <b>'+f+'</b></p><p class="sub">Setelah dikumpulkan, jawaban tidak dapat diubah.</p><div class="bar"><button class="btn sec" id="c">Kembali</button><button class="btn ok" id="y">Ya, kumpulkan</button></div>');
 m.querySelector("#c").onclick=function(){m.remove()};m.querySelector("#y").onclick=function(){m.remove();finish("")};
}
function violation(why){
 if(!S||S.done||lock)return;lock=true;setTimeout(function(){lock=false},1500);
 S.viol++;save();
 if(S.viol>=2){finish("Ujian dihentikan otomatis: pelanggaran kedua ("+why+").");return}
 var m=modal('<h1>⚠️ Peringatan Kecurangan</h1><p>Terdeteksi: <b>'+why+'</b>.</p><p>Ini peringatan <b>satu-satunya</b>. Jika terulang, ujian dihentikan dan jawaban langsung dikumpulkan.</p><button class="btn w" id="o">Saya mengerti, lanjutkan</button>');
 m.querySelector("#o").onclick=function(){m.remove();try{if(fsOk&&!document.fullscreenElement)document.documentElement.requestFullscreen()}catch(e){}};
}
document.addEventListener("visibilitychange",function(){if(document.hidden)violation("berpindah tab / aplikasi lain")});
window.addEventListener("blur",function(){violation("meninggalkan jendela ujian")});
document.addEventListener("fullscreenchange",function(){if(fsOk&&!document.fullscreenElement)violation("keluar dari mode layar penuh")});
["contextmenu","copy","cut","paste","dragstart"].forEach(function(t){document.addEventListener(t,function(e){if(S&&!S.done&&e.target.tagName!=="INPUT")e.preventDefault()})});
function finish(note){
 if(S.done)return;S.done=true;S.note=note;S.fin=Date.now();save();clearInterval(tk);
 document.querySelectorAll(".ov").forEach(function(o){o.remove()});
 try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
 result();scrollTo(0,0);
}
function result(){
 var b=0;DATA.forEach(function(d,i){if(S.ans[i]===d.a)b++});var sc=Math.round(b/DATA.length*1000)/10;
 var h='<div class="card" style="text-align:center"><h1>Hasil Ujian</h1><p class="sub">Sejarah Tingkat Lanjut · Kelas XI · Ujian Akhir Semester Ganjil 2026/2027</p><div class="score">'+sc+'</div><p class="sub">Nilai akhir</p>'+
 (S.note?'<p style="color:var(--bad);font-weight:700">'+esc(S.note)+'</p>':'')+
 '<table class="info" style="margin:0 auto;text-align:left"><tr><td>Nama</td><td><b>'+esc(S.st.n)+'</b></td></tr><tr><td>Kelas</td><td><b>'+esc(S.st.k)+'</b></td></tr><tr><td>No. Peserta Didik</td><td><b>'+esc(S.st.p)+'</b></td></tr><tr><td>Asal Sekolah</td><td><b>'+esc(S.st.s)+'</b></td></tr></table></div>';
 DATA.forEach(function(d,i){var u=S.ans[i],ok=u===d.a;
  h+='<div class="card"><div class="qn">Soal '+(i+1)+'</div><div class="qt">'+esc(d.q)+'</div>'+
  '<div><b>Jawaban Anda:</b> '+(u===undefined?'—':esc(d.o[u]))+'</div></div>';});
 h+='<p style="text-align:center"><button class="btn sec" id="rs">Mulai ulang (khusus pengawas)</button></p>';
 app.innerHTML=h;
 document.getElementById("rs").onclick=function(){pinModal(function(){localStorage.removeItem(KEY);S=null;loginView()})};
}
S=load();
if(S&&S.done)result();else if(S){if(Date.now()>=S.end)finish("Waktu ujian habis.");else examView()}else loginView();
</script></body></html>
